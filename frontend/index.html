<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GLUAY GLUAY — AI Video Workspace</title>
  <style>
    :root{color-scheme:dark;font-family:system-ui,sans-serif;background:#0c1024;color:#f4f6ff}
    body{max-width:760px;margin:0 auto;padding:28px 18px}
    main{background:#171f43;border:1px solid #344477;border-radius:18px;padding:22px}
    h1{margin:0 0 8px}p{color:#b9c5eb;line-height:1.6}
    button{background:#e8ad35;color:#171326;border:0;border-radius:10px;padding:12px 18px;font-weight:700}
    pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#0b122b;padding:14px;border-radius:10px}
  </style>
</head>
<body>
  <main>
    <h1>🍌 GLUAY GLUAY</h1>
    <p>AI Video Workspace — local API connection check</p>
    <button id="check">ตรวจสอบการเชื่อมต่อ API</button>
    <pre id="result">ยังไม่ได้ตรวจสอบ</pre>
  </main>
  <script>
    document.getElementById("check").addEventListener("click", async () => {
      const output = document.getElementById("result");
      output.textContent = "กำลังเชื่อมต่อ...";
      try {
        const response = await fetch("http://127.0.0.1:8000/health");
        const data = await response.json();
        output.textContent = JSON.stringify(data, null, 2);
      } catch (error) {
        output.textContent = "เชื่อมต่อไม่ได้: " + error.message +
          "\nกรุณาเปิด backend บนคอมพิวเตอร์ก่อน";
      }
    });
  </script>
</body>
</html>
